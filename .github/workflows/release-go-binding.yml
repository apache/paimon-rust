name: Release Go Binding

on:
  push:
    tags:
      # Trigger this workflow when tag follows the versioning format: v<major>.<minor>.<patch> OR v<major>.<minor>.<patch>-rc<release_candidate>
      # Example valid tags: v0.4.0, v0.4.0-rc1
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0 or v0.1.0-rc1
        required: true
        type: string
      source_ref:
        description: Rust release baseline ref, for example main, v0.1.0-rc1, or a commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      tag_object: ${{ steps.meta.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Validate release version and tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          event_name="${GITHUB_EVENT_NAME}"
          version=''
          source_ref=''

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            source_ref="$INPUT_SOURCE_REF"
          else
            tag_name="$GITHUB_REF_NAME"
            source_ref="$GITHUB_SHA"
            version="$tag_name"
          fi

          if [[ ! "$version" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[1-9][0-9]*)?$ ]]; then
            echo "invalid version: $version; expected vX.Y.Z or vX.Y.Z-rcN" >&2
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"
          if [[ -z "$source_ref" ]]; then
            echo "source_ref must not be empty" >&2
            exit 1
          fi

          source_sha=$(git rev-parse --verify "$source_ref^{commit}") || {
            echo "source_ref does not resolve to a commit: $source_ref" >&2
            exit 1
          }

          workspace_version=$(
            cargo metadata --locked --format-version 1 --no-deps |
              jq -er '.packages[] | select(.name == "paimon") | .version'
          )
          if [[ "$tag_version" != "$workspace_version" ]]; then
            echo "version $tag_version does not match workspace $workspace_version" >&2
            exit 1
          fi

          tag="bindings/go/$version"
          tag_ref="refs/tags/$tag"
          tag_object=''
          if git show-ref --verify --quiet "$tag_ref"; then
            tag_object=$(git rev-parse "$tag_ref")
            if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
              echo "existing release tag is not annotated: $tag" >&2
              exit 1
            fi
            tag_commit=$(git rev-parse "$tag_ref^{commit}")
            tag_line=$(git rev-list --parents -n 1 "$tag_commit")
            if [[ "$tag_commit" != "$source_sha" && "$tag_line" != "$tag_commit $source_sha" ]]; then
              echo "existing tag $tag is not based on $source_sha" >&2
              exit 1
            fi
            if [[ "$tag_commit" != "$source_sha" ]]; then
              while IFS= read -r path; do
                case "$path" in
                  bindings/go/LICENSE | \
                    bindings/go/NOTICE | \
                    bindings/go/libpaimon_c.linux.amd64.so.zst | \
                    bindings/go/libpaimon_c.linux.arm64.so.zst | \
                    bindings/go/libpaimon_c.darwin.amd64.dylib.zst | \
                    bindings/go/libpaimon_c.darwin.arm64.dylib.zst | \
                    bindings/go/THIRD-PARTY-LICENSES.linux.amd64.html | \
                    bindings/go/THIRD-PARTY-LICENSES.linux.arm64.html | \
                    bindings/go/THIRD-PARTY-LICENSES.darwin.amd64.html | \
                    bindings/go/THIRD-PARTY-LICENSES.darwin.arm64.html) ;;
                  *)
                    echo "existing tag $tag changes unexpected path: $path" >&2
                    exit 1
                    ;;
                esac
              done < <(git diff-tree --no-commit-id --name-only -r "$source_sha" "$tag_commit")
            fi
            echo "existing tag $tag is based on the requested source; the release can resume"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            expected_file: libpaimon_c.linux.amd64.so.zst
            rust_target: x86_64-unknown-linux-gnu
            license_file: THIRD-PARTY-LICENSES.linux.amd64.html
          - runner: ubuntu-24.04-arm
            expected_file: libpaimon_c.linux.arm64.so.zst
            rust_target: aarch64-unknown-linux-gnu
            license_file: THIRD-PARTY-LICENSES.linux.arm64.html
          - runner: macos-15-intel
            expected_file: libpaimon_c.darwin.amd64.dylib.zst
            rust_target: x86_64-apple-darwin
            license_file: THIRD-PARTY-LICENSES.darwin.amd64.html
          - runner: macos-15
            expected_file: libpaimon_c.darwin.arm64.dylib.zst
            rust_target: aarch64-apple-darwin
            license_file: THIRD-PARTY-LICENSES.darwin.arm64.html

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Rust build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-about
        if: matrix.runner != 'macos-15-intel'
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-about@0.9.1

      - name: Install cargo-about on Intel macOS
        if: matrix.runner == 'macos-15-intel'
        shell: bash
        run: |
          if cargo-about --version 2>/dev/null | grep -Fqx 'cargo-about 0.9.1'; then
            echo 'cargo-about 0.9.1 is already installed'
          else
            cargo install cargo-about --version 0.9.1 --locked --features cli --force
          fi

      - name: Install zstd on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install zstd on macOS
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Build embedded shared library
        working-directory: bindings/go
        run: make build

      - name: Stage and verify packaged library
        shell: bash
        run: |
          mkdir -p release/go
          cargo fetch --locked
          python3 scripts/release_licenses.py \
            --generate-go-report \
            '${{ matrix.rust_target }}' \
            release/go
          cp 'bindings/go/${{ matrix.expected_file }}' release/go/
          python3 scripts/verify_go_release_artifacts.py \
            --artifacts-dir release/go \
            --target '${{ matrix.rust_target }}'

      - name: Upload packaged library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.expected_file }}
          path: |
            release/go/${{ matrix.expected_file }}
            release/go/${{ matrix.license_file }}
          if-no-files-found: error

  tag:
    needs:
      - validate
      - build
    outputs:
      tag_object: ${{ steps.tag_state.outputs.tag_object }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install cargo-about
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-about@0.9.1

      - name: Fetch locked release inputs
        run: cargo fetch --locked

      - name: Install artifact verification tools
        run: sudo apt-get update && sudo apt-get install -y file zstd

      - name: Download packaged libraries
        uses: actions/download-artifact@v8
        with:
          path: release/go
          merge-multiple: true

      - name: Generate and verify release legal files
        shell: bash
        run: |
          python3 scripts/release_licenses.py \
            --generate-go-release release/go
          python3 scripts/verify_go_release_artifacts.py --artifacts-dir release/go

      - name: Create release tag commit
        id: tag_state
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REF: ${{ needs.validate.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          release_files=(
            LICENSE
            NOTICE
            libpaimon_c.linux.amd64.so.zst
            libpaimon_c.linux.arm64.so.zst
            libpaimon_c.darwin.amd64.dylib.zst
            libpaimon_c.darwin.arm64.dylib.zst
            THIRD-PARTY-LICENSES.linux.amd64.html
            THIRD-PARTY-LICENSES.linux.arm64.html
            THIRD-PARTY-LICENSES.darwin.amd64.html
            THIRD-PARTY-LICENSES.darwin.arm64.html
          )
          tag_ref="refs/tags/$TAG"
          current_tag_object=''
          if git show-ref --verify --quiet "$tag_ref"; then
            current_tag_object=$(git rev-parse "$tag_ref")
          fi
          if [[ "$current_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "tag $TAG changed after validation" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Reusing artifacts from existing tag: $TAG"
            for file in "${release_files[@]}"; do
              git show "${EXPECTED_TAG_OBJECT}^{commit}:bindings/go/${file}" > "release/go/${file}"
            done
            python3 scripts/verify_go_release_artifacts.py --artifacts-dir release/go
            echo "tag_object=$EXPECTED_TAG_OBJECT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp release/go/libpaimon_c.*.zst bindings/go/
          cp \
            release/go/LICENSE \
            release/go/NOTICE \
            release/go/THIRD-PARTY-LICENSES.*.html \
            bindings/go/
          git add \
            bindings/go/libpaimon_c.*.zst \
            bindings/go/LICENSE \
            bindings/go/NOTICE \
            bindings/go/THIRD-PARTY-LICENSES.*.html

          if ! git diff --cached --quiet; then
            git commit -m "bindings/go: release ${VERSION} (from ${SOURCE_REF}@${SOURCE_SHA})"
          fi

          git tag -a "$TAG" -m "Release Go binding ${VERSION} from ${SOURCE_REF}@${SOURCE_SHA}"
          git push origin "refs/tags/$TAG"
          tag_object=$(git rev-parse "refs/tags/$TAG")
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

  publish:
    needs:
      - validate
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.source_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install artifact verification tools
        run: sudo apt-get update && sudo apt-get install -y file zstd

      - name: Restore and verify tagged release artifacts
        env:
          TAG_OBJECT: ${{ needs.tag.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/go
          release_files=(
            LICENSE
            NOTICE
            libpaimon_c.linux.amd64.so.zst
            libpaimon_c.linux.arm64.so.zst
            libpaimon_c.darwin.amd64.dylib.zst
            libpaimon_c.darwin.arm64.dylib.zst
            THIRD-PARTY-LICENSES.linux.amd64.html
            THIRD-PARTY-LICENSES.linux.arm64.html
            THIRD-PARTY-LICENSES.darwin.amd64.html
            THIRD-PARTY-LICENSES.darwin.arm64.html
          )
          for file in "${release_files[@]}"; do
            git show "${TAG_OBJECT}^{commit}:bindings/go/${file}" > "release/go/${file}"
          done
          python3 scripts/verify_go_release_artifacts.py --artifacts-dir release/go

      - name: Create GitHub release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG_OBJECT: ${{ needs.tag.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        working-directory: release/go
        run: |
          set -euo pipefail
          remote_tag_object=$(
            git ls-remote --refs origin "refs/tags/$TAG" |
              awk 'NR == 1 { print $1 }'
          )
          if [[ "$remote_tag_object" != "$TAG_OBJECT" ]]; then
            echo "remote tag $TAG changed before GitHub Release creation" >&2
            exit 1
          fi
          release_files=(
            LICENSE
            NOTICE
            libpaimon_c.linux.amd64.so.zst
            libpaimon_c.linux.arm64.so.zst
            libpaimon_c.darwin.amd64.dylib.zst
            libpaimon_c.darwin.arm64.dylib.zst
            THIRD-PARTY-LICENSES.linux.amd64.html
            THIRD-PARTY-LICENSES.linux.arm64.html
            THIRD-PARTY-LICENSES.darwin.amd64.html
            THIRD-PARTY-LICENSES.darwin.arm64.html
          )
          prerelease=false
          release_flags=(--verify-tag --latest=false)
          if [[ "$VERSION" == *-rc* ]]; then
            prerelease=true
            release_flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating assets on existing GitHub release: $TAG"
            gh release upload "$TAG" "${release_files[@]}" --clobber
            gh release edit "$TAG" \
              --title "Release Go binding $VERSION" \
              --draft=false \
              --prerelease="$prerelease" \
              --latest=false
          else
            gh release create "$TAG" \
              --title "Release Go binding $VERSION" \
              --generate-notes \
              "${release_flags[@]}" \
              "${release_files[@]}"
          fi
